name: Generate Partial Config ZIP and Deploy

on:
  pull_request:
    types:
      - closed
    branches:
      - '*_REL_*'
      - '*REL*'

  workflow_dispatch:
    inputs:
      deploy_description:
        description: 'Deployment description'
        required: false
        default: 'Automated partial config deployment from GitHub Actions'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  generate-config:
    name: Generate Partial Config ZIP
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Determine target branch
        shell: bash
        run: |
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                TARGET_BRANCH="${GITHUB_REF_NAME}"
            else
                TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
            fi

            echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

            echo "================================="
            echo "Target Branch : $TARGET_BRANCH"
            echo "================================="


      - name: Fetch master and target branch
        run: |
          git fetch origin master
          git fetch origin "$TARGET_BRANCH"
          
      - name: Get changed files (target vs master)
        shell: bash
        run: |
            echo "================================="
            echo "Generating Partial Configuration"
            echo "Base Branch   : master"
            echo "Target Branch : $TARGET_BRANCH"
            echo "================================="          
            
            #  All changed files (unfiltered)
            git diff --name-only --diff-filter=ACMRT origin/master...origin/$TARGET_BRANCH > all_changed_files.txt
            
            echo ""
            echo "All changed files:"
            cat all_changed_files.txt
            
            # Exclude deployment framework files and workflow files
            grep -v -E '(^deployment/deploy-config-manager\.js$|^deployment/package\.json$|\.ya?ml$)' all_changed_files.txt > changed_files.txt
            
            echo ""
            echo "Filtered files for deployment ZIP:"
            cat changed_files.txt

      - name: Verify changed files
        shell: bash
        run: |
            if [ ! -s changed_files.txt ]; then
                echo "ERROR: No deployable files found."
                exit 1
            fi
            
            echo "================================="
            echo "Files selected for deployment"
            echo "================================="
            cat changed_files.txt
          
      - name: Create partial-config.zip
        shell: bash
        run: |
            echo "Creating partial-config.zip..."
            zip -@ partial-config.zip < changed_files.txt

            if [ ! -f partial-config.zip ]; then
                echo "ERROR: ZIP creation failed."
                exit 1
            fi

            echo "ZIP created successfully."
            ls -lh partial-config.zip
                    
        
      # Example safety check. Keep this even if your ZIP generation is above.
      - name: Verify partial config ZIP exists
        shell: bash
        run: |
          echo "Checking generated ZIP file..."

          if [ ! -f "partial-config.zip" ]; then
            echo "ERROR: partial-config.zip not found."
            echo "Please ensure your existing ZIP generation step creates partial-config.zip at repository root."
            exit 1
          fi

          echo "partial-config.zip found."
          ls -lh partial-config.zip

          echo "ZIP content:"
          unzip -l partial-config.zip

      - name: Upload partial config artifact
        uses: actions/upload-artifact@v4
        with:
          name: partial-config-artifact
          path: partial-config.zip
          if-no-files-found: error
          retention-days: 7
          

  deploy-config:
    name: Deploy Partial Config to Configuration Manager

    needs: generate-config

    runs-on: ubuntu-latest

    env:
      CONFIG_MANAGER_URL: ${{ secrets.CONFIG_MANAGER_URL }}
      CONFIG_MANAGER_USERNAME: ${{ secrets.CONFIG_MANAGER_USERNAME }}
      CONFIG_MANAGER_PASSWORD: ${{ secrets.CONFIG_MANAGER_PASSWORD }}

      ENABLE_CONFIG_DEPLOYMENT: ${{ secrets.ENABLE_CONFIG_DEPLOYMENT }}

      CONFIG_ZIP_PATH: ../partial-config.zip

      DEPLOY_MODE: merge

      DEPLOY_DESCRIPTION: >
        Repo:${{ github.repository }}
        Branch:${{ github.ref_name }}
        Run:${{ github.run_id }}
        Commit:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download partial config artifact
        uses: actions/download-artifact@v4
        with:
          name: partial-config-artifact
          path: .

      - name: Verify downloaded ZIP
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          if [ ! -f "partial-config.zip" ]; then
            echo "ERROR: partial-config.zip was not downloaded."
            exit 1
          fi

          echo "Downloaded ZIP:"
          ls -lh partial-config.zip

          echo "ZIP Content:"
          unzip -l partial-config.zip

      - name: Display deployment metadata
        run: |
            echo "=========================================="
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ github.ref_name }}"
            echo "Run ID     : ${{ github.run_id }}"
            echo "Commit     : ${{ github.sha }}"
            echo "=========================================="
            
        
      - name: Normalize Deployment Switch
        id: deployment_switch
        shell: bash
        run: |
            DEPLOY_SWITCH=$(echo "${ENABLE_CONFIG_DEPLOYMENT}" | tr '[:upper:]' '[:lower:]')

            echo "deploy_switch=$DEPLOY_SWITCH" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=========================================="
            echo "Deployment Switch"
            echo "Raw Value        : ${ENABLE_CONFIG_DEPLOYMENT}"
            echo "Normalized Value : ${DEPLOY_SWITCH}"
            echo "=========================================="
        env:
            ENABLE_CONFIG_DEPLOYMENT: ${{ secrets.ENABLE_CONFIG_DEPLOYMENT }}

      - name: Deployment Switch Status
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Deployment Switch Status"
          echo "DEPLOY_SWITCH=${{ steps.deployment_switch.outputs.deploy_switch }}"
          echo "=========================================="

          if [ "${{ steps.deployment_switch.outputs.deploy_switch }}" = "true" ]; then
            echo "Deployment ENABLED"
          else
            echo "Deployment DISABLED"
            echo "Zip generation completed successfully."
            echo "Deployment step will be skipped."
          fi
          
          
      - name: Setup Node.js
        if: ${{ steps.deployment_switch.outputs.deploy_switch == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: deployment/package-lock.json

      - name: Install Node dependencies
        if: ${{ steps.deployment_switch.outputs.deploy_switch == 'true' }}
        working-directory: deployment
        run: npm ci

      - name: Install Chromium browser
        if: ${{ steps.deployment_switch.outputs.deploy_switch == 'true' }}
        working-directory: deployment
        run: npx playwright install chromium --with-deps


      - name: Deploy config using Nokia Configuration Manager UI
        if: ${{ steps.deployment_switch.outputs.deploy_switch == 'true' }}
        working-directory: deployment
        run: node deploy-config-manager.js
        env:
          CONFIG_MANAGER_URL: ${{ env.CONFIG_MANAGER_URL }}
          CONFIG_MANAGER_USERNAME: ${{ env.CONFIG_MANAGER_USERNAME }}
          CONFIG_MANAGER_PASSWORD: ${{ env.CONFIG_MANAGER_PASSWORD }}
          CONFIG_ZIP_PATH: ${{ env.CONFIG_ZIP_PATH }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          DEPLOY_DESCRIPTION: ${{ env.DEPLOY_DESCRIPTION }}
          HEADLESS: 'true'

      - name: Upload deployment screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          retention-days: 7
          path: |
            deployment/screenshots/**
            deployment/logs/**
            partial-config.zip
          if-no-files-found: ignore
