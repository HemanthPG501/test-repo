name: Generate Partial Config ZIP

on:
  pull_request:
    types: [closed]
    branches:
      - '*REL*'   #  matches ALL release branches

jobs:
  generate-config:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch master and target branch
        run: |
          git fetch origin master
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get changed files (target vs master)
        run: |
          TARGET_BRANCH=${{ github.event.pull_request.base.ref }}

          echo "Using branch: $TARGET_BRANCH"

          #  All changed files (unfiltered)
          git diff --name-only --diff-filter=ACMRT origin/master...origin/$TARGET_BRANCH > all_changed_files.txt

          #  Filter out .yml / .yaml files
          grep -v -E '\.ya?ml$' all_changed_files.txt > changed_files.txt

          echo "Filtered changed files:"
          cat changed_files.txt
          
#  Create partial-config.zip
      - name: Create partial-config.zip
        run: |
          zip -@ partial-config.zip < changed_files.txt
          
#  Create final folder structure
      - name: Prepare final artifact folder
        run: |
          mkdir generated-config
          mv partial-config.zip generated-config/
          mv changed_files.txt generated-config/
          mv all_changed_files.txt generated-config/

#  Upload single artifact (GitHub will zip this)
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-config
          path: generated-config

          
deploy-partial-config:
    name: Deploy Partial Config to Configuration Manager
    needs: prepare-partial-config

    # If URL requires VPN/internal network, replace with: runs-on: self-hosted
    runs-on: ubuntu-latest

    # Recommended: configure GitHub Environment approval for cert/prod.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'qa' }}

    env:
      CONFIG_MANAGER_URL: ${{ secrets.CONFIG_MANAGER_URL }}
      CONFIG_MANAGER_USERNAME: ${{ secrets.CONFIG_MANAGER_USERNAME }}
      CONFIG_MANAGER_PASSWORD: ${{ secrets.CONFIG_MANAGER_PASSWORD }}
      CONFIG_ZIP_PATH: partial-config.zip
      DEPLOYMENT_DESCRIPTION: >
        Automated partial config deployment from GitHub Actions.
        Repository: ${{ github.repository }},
        Run ID: ${{ github.run_id }},
        Commit: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated config artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-config
          path: .

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Downloaded files:"
          ls -la

          echo "ZIP content:"
          unzip -l partial-config.zip

          echo "Changed files:"
          cat changed_files.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deployment dependencies
        working-directory: deployment
        run: npm install

      - name: Install Playwright browser
        working-directory: deployment
        run: npx playwright install chromium --with-deps

      - name: Deploy partial config using Configuration Manager UI
        working-directory: deployment
        run: node deploy-config-manager.js
        env:
          CONFIG_MANAGER_URL: ${{ env.CONFIG_MANAGER_URL }}
          CONFIG_MANAGER_USERNAME: ${{ env.CONFIG_MANAGER_USERNAME }}
          CONFIG_MANAGER_PASSWORD: ${{ env.CONFIG_MANAGER_PASSWORD }}
          CONFIG_ZIP_PATH: ../partial-config.zip
          DEPLOYMENT_DESCRIPTION: ${{ env.DEPLOYMENT_DESCRIPTION }}
          HEADLESS: 'true'

      - name: Upload deployment screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            deployment/*.png
            changed_files.txt
            all_changed_files.txt
            partial-config.zip
          if-no-files-found: ignore